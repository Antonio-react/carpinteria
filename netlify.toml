[build]
  # Primero genera src/config/site.ts desde las variables de entorno (no está en GitHub).
  command = "node scripts/generate-site-config.mjs && npm run build"
  publish = "dist"

# SPA: cualquier ruta devuelve index.html, así F5 en /trabajos/cocinas no da 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Archivos con hash en el nombre (Vite): caché larga.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cabeceras de seguridad para toda la web.
# - CSP: solo se ejecuta código de este mismo dominio (bloquea scripts inyectados) y la web no se puede
#   meter dentro de otra (frame-ancestors, evita "clickjacking"). Estilos 'unsafe-inline' porque React
#   pinta algunos estilos en el atributo style (animaciones, carrusel). Si algún día se añade un
#   servicio externo (mapa, vídeo...), hay que permitir su dominio aquí o no cargará.
# - HSTS: el navegador usa siempre HTTPS. Permissions-Policy: la web no pide cámara, micro ni ubicación.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests"
    X-Frame-Options = "DENY"
    Strict-Transport-Security = "max-age=31536000"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Cross-Origin-Opener-Policy = "same-origin"

# Borrado automático de los envíos del formulario con más de 6 meses (política de privacidad).
# Código y variables necesarias: netlify/functions/purge-form-submissions.mts
[functions."purge-form-submissions"]
  schedule = "@daily"
