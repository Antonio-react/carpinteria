<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- El título, la descripción, el canonical, og:url/og:title/og:description y la ficha del negocio
         para Google (JSON-LD) los añade al compilar vite/seoHead.ts, con los datos de src/data/pages.ts y
         src/config/site.ts: aquí no se escriben a mano (como en la web de la escuela). -->
    <!-- Indexación controlada por VITE_ROBOTS (.env): "noindex" en pruebas, "index, follow" al publicar. -->
    <meta name="robots" content="%VITE_ROBOTS%" />
    <meta name="theme-color" content="#0f0d0b" />
    <!-- La portada empieza en negro (el color del hero) mientras arranca React, en vez de color hueso
         y de golpe negro. El hero quita este fondo al pintarse (src/components/hero/Hero.tsx).
         Las fotos del hero NO se precargan aquí: se probó (25-nov) y PageSpeed bajaba (en escritorio,
         99 sin precarga frente a ~75 con ella).
         OJO: Netlify solo deja ejecutar este script por su huella (sha256 en netlify.toml). Si se
         cambia, aunque sea un espacio, hay que recalcularla o se bloqueará. -->
    <script>
      if (location.pathname === '/') document.documentElement.style.backgroundColor = '#0f0d0b'
    </script>

    <!-- Favicon como en la escuela: PNG 32 (pestañas) y 192 (Google, múltiplo de 48) con fondo
         transparente; el SVG para los navegadores que lo usan. Generados con scripts/images/logo.mjs. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Imagen al compartir el enlace: una sola configuración para toda la web (los textos, vite/seoHead.ts). -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_ES" />
    <meta property="og:site_name" content="Carpintería y Decoración" />
    <meta property="og:image" content="https://%VITE_SITE_DOMAIN%/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Mueble de salón a medida con el nombre Carpintería y Decoración detrás" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>

    <!--
      Formulario oculto para Netlify Forms: Netlify lee el HTML al publicar y así "descubre" el
      formulario de contacto, que en la web lo pinta React. Los nombres de los campos deben coincidir
      con los de src/components/contact/ContactForm.tsx (presupuesto guiado en 3 pasos, un solo formulario).
    -->
    <form name="contacto" data-netlify="true" netlify-honeypot="bot-field" enctype="multipart/form-data" hidden>
      <input type="text" name="nombre" />
      <input type="text" name="empresa" />
      <input type="email" name="email" />
      <input type="tel" name="telefono" />
      <input type="text" name="ubicacion" />
      <input type="text" name="tipo" />
      <textarea name="mensaje"></textarea>
      <input type="file" name="adjunto-1" />
      <input type="file" name="adjunto-2" />
      <input type="checkbox" name="privacidad" />
      <input type="text" name="bot-field" />
    </form>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
